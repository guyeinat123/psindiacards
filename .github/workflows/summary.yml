name: Daily price summary

on:
  schedule:
    - cron: '0 6 * * *'   # 09:00 Israel in summer, 08:00 in winter
  workflow_dispatch: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Send summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AMAZON_ASINS: ${{ vars.AMAZON_ASINS }}
          FOREIGN_FEE_PCT: ${{ vars.FOREIGN_FEE_PCT || '2.5' }}
        run: python -m src.main summary
