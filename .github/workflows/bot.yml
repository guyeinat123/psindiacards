name: PSN price bot

# One workflow does everything. Every 5 minutes it answers Telegram messages, then runs
# whatever is due: card scan (30 min), games + PS Plus (3 h), morning summary (09:00 IL).
# GitHub may start scheduled runs a few minutes late; replies take ~5-15 minutes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keep-alive below

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # State (users, watchlists, last alerts, latest prices) lives in the Actions cache.
      # The cache is private even though the repo is public.
      - name: Restore DB
        uses: actions/cache/restore@v4
        with:
          path: data/scout.db
          key: scout-db-${{ github.run_id }}
          restore-keys: scout-db-

      - name: Tick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AMAZON_ASINS: ${{ vars.AMAZON_ASINS }}
          MAX_MARKUP_PCT: ${{ vars.MAX_MARKUP_PCT || '15' }}
          FOREIGN_FEE_PCT: ${{ vars.FOREIGN_FEE_PCT || '2.5' }}
          MIN_GAME_DROP_PCT: ${{ vars.MIN_GAME_DROP_PCT || '10' }}
          LOG_LEVEL: INFO
        run: python -m src.main tick

      - name: Save DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/scout.db
          key: scout-db-${{ github.run_id }}

      # GitHub switches off scheduled workflows in public repos after 60 days without
      # activity. Re-enabling it through the API (what the keepalive-workflow action does) avoids that.
      - name: Keep alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable"
